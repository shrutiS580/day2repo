<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<body>
  
<style>

.uber-button {
  background-color: rgb(0, 0, 0);
  color: white;
  border: none;
  padding: 12px 20px;
  font-size: 14px;
  cursor: pointer;
}

.amazon-button {
  background-color: rgb(255, 216, 20);
  color: black;
  border: none;
  border-radius: 20px;
  padding: 10px 30px;
  font-size: 16px;
  cursor: pointer;
}

.github-button {
  background-color: rgb(46, 164, 79);
  color: white;
  border: none;
  border-radius: 6px;
  padding: 12px 22px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}


.bootstrap-start {
  background-color: rgb(121, 82, 179);
  color: white;
  border: none;
  border-radius: 4px;
  padding: 10px 18px;
  font-size: 14px;
  cursor: pointer;
}

.bootstrap-download {
  background-color: white;
  color: rgb(108, 117, 125);
  border: 1px solid rgb(108, 117, 125);
  border-radius: 4px;
  padding: 10px 18px;
  font-size: 14px;
  cursor: pointer;
}

.linkedin-apply {
  background-color: rgb(10, 102, 194);
  color: white;
  border: none;
  border-radius: 20px;
  padding: 10px 25px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

.linkedin-save {
  background-color: white;
  color: rgb(10, 102, 194);
  border: 1px solid rgb(10, 102, 194);
  border-radius: 20px;
  padding: 10px 25px;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}
</style>
    <button class="uber-button">Request now</button>
<br>
<button class="amazon-button">Add to Cart</button>
<br>
<button class="github-button">Sign up</button>
<br>
<button class="bootstrap-start">Get started</button>
<br>
<button class="bootstrap-download">Download</button>
<br>

<button class="linkedin-apply">Apply on company website</button>
<br>
<button class="linkedin-save">Save</button>
    
    
</body>
</html>
