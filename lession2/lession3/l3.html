<!DOCTYPE html>
<html>
<head>
    <title>CSS Buttons Exercise</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h2>CSS Buttons</h2>

    <!-- 3a. Uber -->
    <button class="uber-button">Request now</button>

    <!-- 3b. Amazon -->
    <button class="amazon-button">Add to Cart</button>

    <!-- 3c. GitHub -->
    <button class="github-button">Sign up</button>

    <br><br>

    <!-- 3d. Bootstrap -->
    <button class="bootstrap-start">Get started</button>
    <button class="bootstrap-download">Download</button>

    <br><br>

    <!-- 3e. LinkedIn -->
    <button class="linkedin-apply">Apply on company website</button>
    <button class="linkedin-save">Save</button>
<style>
    /* 3a. Uber */
.uber-button {
    background-color: black;
    color: white;
    border: none;
    padding: 12px 25px;
    font-size: 14px;
    cursor: pointer;
}

.uber-button:hover {
    opacity: 0.8;
}


/* 3b. Amazon */
.amazon-button {
    background-color: rgb(255, 216, 20);
    color: black;
    border: none;
    border-radius: 20px;
    padding: 10px 45px;
    font-size: 15px;
    cursor: pointer;
}

.amazon-button:hover {
    background-color: rgb(245, 205, 10);
}


/* 3c. GitHub */
.github-button {
    background-color: rgb(46, 164, 79);
    color: white;
    border: none;
    border-radius: 6px;
    padding: 12px 25px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.github-button:hover {
    box-shadow: 0px 5px 10px rgba(0, 0, 0, 0.2);
}


/* 3d. Bootstrap */
.bootstrap-start {
    background-color: rgb(108, 99, 255);
    color: white;
    border: none;
    border-radius: 5px;
    padding: 12px 25px;
    font-size: 15px;
    cursor: pointer;
}

.bootstrap-download {
    background-color: white;
    color: rgb(108, 99, 255);
    border: 1px solid rgb(108, 99, 255);
    border-radius: 5px;
    padding: 12px 25px;
    font-size: 15px;
    cursor: pointer;
}


/* 3e. LinkedIn */
.linkedin-apply {
    background-color: rgb(10, 102, 194);
    color: white;
    border: none;
    border-radius: 20px;
    padding: 10px 25px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
}

.linkedin-save {
    background-color: white;
    color: rgb(10, 102, 194);
    border: 1px solid rgb(10, 102, 194);
    border-radius: 20px;
    padding: 10px 25px;
    font-size: 15px;
    cursor: pointer;
}
</style>
</body>

</html>
